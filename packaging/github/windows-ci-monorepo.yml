name: Yike Windows build and regression tests

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/yike-windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/yike-windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Windows core application
        run: .\build.ps1 -OutputDirectory dist\ci -SkipRuntimes
      - name: Run offline regression tests
        run: .\verify.ps1 -OutputDirectory dist\ci -SkipBuild -SelfTestOnly
      - name: Run offline speech connection tests
        run: python .\tests\OnlineSpeechTests.py
      - name: Upload Windows core build and test report
        uses: actions/upload-artifact@v7
        with:
          name: Yike-Windows-x64-core
          path: windows/dist/ci/
          if-no-files-found: error
          retention-days: 14
